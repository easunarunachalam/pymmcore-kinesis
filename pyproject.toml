[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymmcore-kinesis"
version = "0.1.0"
description = "Thorlabs Kinesis (KDC101) rotation stages as Python Micro-Manager devices for pymmcore-plus / napari-micromanager"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Easun Arunachalam" }]
classifiers = [
    "Framework :: napari",
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    # UniMMCore (Python devices) is still under pymmcore_plus.experimental:
    # 0.17 added config groups / cfg files with Python devices, 0.18 the
    # "Position" property handling in the MDA engine.  Bump deliberately.
    "pymmcore-plus>=0.18.1,<0.19",
    # the full "pylablib" distribution pulls in PyQt5 (its own GUI helpers),
    # which would shadow the PyQt6 that napari-micromanager 0.3 needs
    "pylablib-lightweight>=1.4.3",
]

[project.optional-dependencies]
# the RotationStagesWidget (Qt) and the napari plugin entry
napari = [
    "qtpy",
    "napari>=0.5",
    "napari-micromanager>=0.3.1,<0.4",
    # the preset-dropdown workaround patches a private method of this version
    "pymmcore-widgets>=0.12,<0.13",
]
test = ["pytest", "pytest-qt"]

# napari discovers the plugin through this entry point (npe2 manifest).
[project.entry-points."napari.manifest"]
pymmcore-kinesis = "pymmcore_kinesis:napari.yaml"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pymmcore_kinesis = ["napari.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyqt6"
